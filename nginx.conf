# Nginx 反向代理配置
# 将本文件放到 /etc/nginx/sites-available/study-ai-docs
# 然后: ln -s /etc/nginx/sites-available/study-ai-docs /etc/nginx/sites-enabled/
# 测试: nginx -t
# 重载: nginx -s reload

server {
    listen 80;
    server_name your-domain.com;  # 改成你的域名或服务器 IP

    # 日志
    access_log /var/log/nginx/study-ai-docs-access.log;
    error_log  /var/log/nginx/study-ai-docs-error.log;

    # 文件上传大小限制
    client_max_body_size 10m;

    # ===== 静态文件：直接由 Nginx 提供（更快） =====
    # VitePress 构建产物中的静态资源（JS / CSS / 图片 / 字体）
    location /assets/ {
        alias /opt/study-ai-docs/docs/.vitepress/dist/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /logo.svg {
        alias /opt/study-ai-docs/docs/.vitepress/dist/logo.svg;
        expires 7d;
    }

    location /vp-icons.css {
        alias /opt/study-ai-docs/docs/.vitepress/dist/vp-icons.css;
        expires 7d;
    }

    # ===== 后台管理 API（反向代理到 Node.js） =====
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置（大文件保存可能较慢）
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 后台管理页面（反向代理到 Node.js）
    location /admin/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ===== 所有其他请求：回退到 VitePress 静态页面 =====
    location / {
        root /opt/study-ai-docs/docs/.vitepress/dist;
        index index.html;
        try_files $uri $uri.html $uri/ /index.html;
    }

    # 禁止访问敏感文件
    location ~ /\. {
        deny all;
    }
    location ~ \.bak$ {
        deny all;
    }
}

